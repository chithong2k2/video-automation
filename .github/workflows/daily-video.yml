name: Daily Video Pipeline

# ⚠️ KHÔNG dùng `on: schedule` ở đây nữa.
# GitHub cron là best-effort, run có thể bị delay hoặc drop hoàn toàn khi tải cao
# (docs: "some queued jobs may be dropped"). Repo này đã bị drop 100% run theo lịch
# ngày 18/10 -> không có video nào được đăng lúc 07:15 và 10:05.
# Lịch giờ chạy giờ do Cloudflare Worker `worker/` đảm nhiệm, gọi workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      type:
        description: "Chọn định dạng video cần tạo"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - news
          - lesson
      dry_run:
        description: "Chỉ sinh kịch bản để kiểm tra chủ đề, không render/không đăng"
        required: false
        type: boolean
        default: false
      publish:
        description: "Đăng lên Facebook (tắt để render thử mà không đăng)"
        required: false
        type: boolean
        default: true

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Remotion cần Chrome & phông chữ để render sắc nét
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto \
            fonts-noto-cjk

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade "edge-tts==7.3.1"

      # Nạp chủ đề ~15 video gần nhất để không lặp tin
      # + chuỗi primitive của 6 video trước để AI brainstorm không lặp lại ngữ pháp cũ
      - name: Load recent topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=15" \
            --jq '[.[] | (.body // "") | split("\n") | map(select(startswith("TOPIC:"))) | .[0] // "" | sub("^TOPIC:[ ]*"; "")] | map(select(. != "")) | join(" || ")')
          COUNT=$(printf '%s' "$RECENT" | grep -o '||' | wc -l)
          echo "Nạp được $COUNT chủ đề cũ để loại trừ"

          TYPES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=6" \
            --jq '[.[] | (.body // "") | split("\n") | map(select(startswith("TYPES:"))) | .[0] // "" | sub("^TYPES:[ ]*"; "")] | map(select(. != "")) | join(" || ")')

          echo "Chuỗi cảnh cũ: ${TYPES:-(chưa có)}"

          {
            echo "RECENT_TOPICS=$RECENT"
            echo "RECENT_TYPES=$TYPES"
          } >> "$GITHUB_ENV"

      # TIN TỨC -> hệ mới: FreeVideo + thư viện primitive + voice từng cảnh
      - name: Render news video (FreeVideo + voice)
        if: ${{ (inputs.type || 'auto') != 'lesson' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ACTIVEPIECES_WEBHOOK_URL: ${{ secrets.ACTIVEPIECES_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/freeform.mjs live --out out/video.mp4 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ !inputs.publish && '--no-publish' || '' }}

      # BÀI HỌC -> giữ pipeline cũ (chưa port sang hệ mới)
      - name: Render lesson video (pipeline cũ)
        if: ${{ (inputs.type || 'auto') == 'lesson' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ACTIVEPIECES_WEBHOOK_URL: ${{ secrets.ACTIVEPIECES_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pipeline.mjs --type=lesson ${{ inputs.dry_run && '--dry-run' || '' }}

      # Giữ video như artifact phòng khi cần xem lại
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_id }}
          path: out/video.mp4
          retention-days: 7
