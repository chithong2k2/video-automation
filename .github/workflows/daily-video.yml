name: Daily Video Pipeline

on:
  schedule:
    - cron: "0 2 * * *"  # Chạy 9:00 sáng giờ VN (UTC+7 = UTC 02:00)
  workflow_dispatch:       # Cho phép chạy tay từ GitHub UI

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Remotion cần Chrome để render
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto \
            fonts-noto-cjk

      - name: Install dependencies
        run: npm install

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ACTIVEPIECES_WEBHOOK_URL: ${{ secrets.ACTIVEPIECES_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pipeline.mjs

      # Giữ video như artifact phòng khi cần debug
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_id }}
          path: out/video.mp4
          retention-days: 7
