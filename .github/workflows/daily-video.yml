name: Daily Video Pipeline

# ⚠️ KHÔNG dùng `on: schedule` ở đây nữa.
# GitHub cron là best-effort, run có thể bị delay hoặc drop hoàn toàn khi tải cao
# (docs: "some queued jobs may be dropped"). Repo này đã bị drop 100% run theo lịch
# ngày 18/10 -> không có video nào được đăng lúc 07:15 và 10:05.
# Lịch giờ chạy giờ do Cloudflare Worker `worker/` đảm nhiệm, gọi workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      type:
        description: "Chọn định dạng video cần tạo"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - news
          - lesson

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Remotion cần Chrome & phông chữ để render sắc nét
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto \
            fonts-noto-cjk

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade "edge-tts==7.3.1"

      # Nạp chủ đề ~15 video gần nhất để pipeline không lặp lại cùng một tin
      - name: Load recent topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=15" \
            --jq '[.[] | (.body // "") | split("\n") | map(select(startswith("TOPIC:"))) | .[0] // "" | sub("^TOPIC:[ ]*"; "")] | map(select(. != "")) | join(" || ")')
          COUNT=$(printf '%s' "$RECENT" | grep -o '||' | wc -l)
          echo "Nạp được $COUNT chủ đề cũ để loại trừ"
          echo "RECENT_TOPICS=$RECENT" >> "$GITHUB_ENV"

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ACTIVEPIECES_WEBHOOK_URL: ${{ secrets.ACTIVEPIECES_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pipeline.mjs --type=${{ inputs.type || 'auto' }}

      # Giữ video như artifact phòng khi cần xem lại
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_id }}
          path: out/video.mp4
          retention-days: 7
