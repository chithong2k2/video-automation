name: Daily Video Pipeline

on:
  schedule:
    # 4 Video Tin Tức + 2 Video Bài Học B2B chia đều trong ngày (Giờ Việt Nam = UTC + 7, chạy lệch phút chống nghẽn hàng đợi)
    - cron: "15 0 * * *"   # 07:15 Sáng VN -> Bản tin công nghệ & kinh doanh 1
    - cron: "5 3 * * *"    # 10:05 Sáng VN -> Bài học thực chiến B2B 1
    - cron: "5 6 * * *"    # 13:05 Chiều VN -> Bản tin công nghệ & kinh doanh 2
    - cron: "5 9 * * *"    # 16:05 Chiều VN -> Bản tin công nghệ & kinh doanh 3
    - cron: "35 11 * * *"  # 18:35 Tối VN -> Bài học thực chiến B2B 2
    - cron: "35 13 * * *"  # 20:35 Tối VN -> Bản tin công nghệ & kinh doanh 4
  workflow_dispatch:
    inputs:
      type:
        description: "Chọn định dạng video cần tạo"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - news
          - lesson

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Remotion cần Chrome & phông chữ để render sắc nét
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto \
            fonts-noto-cjk

      - name: Install dependencies
        run: |
          npm install
          pip install edge-tts

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ACTIVEPIECES_WEBHOOK_URL: ${{ secrets.ACTIVEPIECES_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pipeline.mjs --type=${{ inputs.type || 'auto' }}

      # Giữ video như artifact phòng khi cần xem lại
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_id }}
          path: out/video.mp4
          retention-days: 7
